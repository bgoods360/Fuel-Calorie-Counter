<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="fuel.">
<title>fuel.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08080f;
    --surface: #111118;
    --border: #1a1a28;
    --text: #f0ede8;
    --muted: #6b6b7a;
    --dim: #2e2e40;
    --accent: #f97316;
    --danger: #ef4444;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  input, button { font-family: var(--sans); }
  input { outline: none; }
  button { cursor: pointer; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 24px 0; }
  .app-name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .app-name span { color: var(--accent); }
  .date-label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
  .settings-btn { background: none; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 16px; line-height: 1; transition: all 0.2s; }
  .settings-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Ring area */
  .ring-section { padding: 24px 24px 8px; display: flex; flex-direction: column; align-items: center; }
  .ring-wrap { position: relative; width: 220px; height: 220px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-number { font-family: var(--mono); font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .ring-unit { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-top: 4px; }
  .ring-remaining { font-family: var(--mono); font-size: 12px; margin-top: 8px; }
  .ring-stats { display: flex; gap: 28px; margin-top: 16px; }
  .stat { text-align: center; }
  .stat-num { font-family: var(--mono); font-size: 18px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
  .stat-div { width: 1px; background: var(--border); }

  /* Input section */
  .input-section { padding: 8px 24px 0; flex: 1; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; font-family: var(--sans); transition: all 0.2s; letter-spacing: 0.3px; }
  .tab-btn.active { border-color: var(--accent); background: rgba(249,115,22,0.1); color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Inputs */
  .field { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 15px; transition: border-color 0.2s; }
  .field:focus { border-color: rgba(249,115,22,0.5); }
  .field::placeholder { color: var(--muted); }
  .search-row { display: flex; gap: 8px; }
  .search-row .field { flex: 1; }
  .go-btn { background: var(--accent); border: none; border-radius: 12px; padding: 0 20px; color: #fff; font-size: 20px; font-weight: 700; transition: opacity 0.2s; white-space: nowrap; }
  .go-btn:hover { opacity: 0.85; }
  .go-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; }

  /* Result card */
  .result-card { background: var(--surface); border: 1px solid rgba(249,115,22,0.4); border-radius: 14px; padding: 16px; margin-top: 12px; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .result-name { font-size: 16px; font-weight: 700; }
  .result-serving { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .result-cal { font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--accent); margin-top: 8px; }
  .result-cal span { font-size: 14px; color: var(--muted); }
  .add-btn { background: var(--accent); border: none; border-radius: 10px; padding: 10px 22px; color: #fff; font-weight: 700; font-size: 14px; margin-top: 12px; transition: opacity 0.2s; }
  .add-btn:hover { opacity: 0.85; }

  /* Frequent */
  .freq-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 0; }
  .freq-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .freq-item:last-child { border-bottom: none; }
  .freq-name { font-size: 14px; font-weight: 600; }
  .freq-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .freq-add { background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.25); border-radius: 8px; padding: 7px 16px; color: var(--accent); font-weight: 700; font-size: 16px; transition: all 0.2s; }
  .freq-add:hover { background: rgba(249,115,22,0.2); }

  /* Manual */
  .manual-fields { display: flex; flex-direction: column; gap: 10px; }
  .primary-btn { width: 100%; background: var(--accent); border: none; border-radius: 12px; padding: 14px; color: #fff; font-size: 15px; font-weight: 700; font-family: var(--sans); transition: opacity 0.2s; }
  .primary-btn:hover { opacity: 0.85; }

  /* Log */
  .log-section { padding: 20px 24px 40px; }
  .section-title { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .log-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 12px; padding: 13px 16px; margin-bottom: 8px; animation: slideUp 0.2s ease; }
  .log-name { font-size: 14px; font-weight: 600; }
  .log-time { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
  .log-right { display: flex; align-items: center; gap: 4px; }
  .log-cal { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--accent); }
  .remove-btn { background: none; border: none; color: var(--dim); font-size: 20px; padding: 0 0 0 8px; line-height: 1; transition: color 0.2s; }
  .remove-btn:hover { color: var(--danger); }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #12121c; border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 28px 24px calc(28px + env(safe-area-inset-bottom)); width: 100%; max-width: 430px; animation: modalUp 0.25s ease; }
  @keyframes modalUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .modal-group { margin-bottom: 16px; }
  .api-note { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .modal-save { width: 100%; background: var(--accent); border: none; border-radius: 12px; padding: 14px; color: #fff; font-size: 15px; font-weight: 700; font-family: var(--sans); margin-top: 4px; }
  .modal-cancel { width: 100%; background: none; border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 15px; font-weight: 700; font-family: var(--sans); margin-top: 10px; }

  /* Loading spinner */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="app-name">fuel<span>.</span></div>
      <div class="date-label" id="date-label"></div>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙</button>
  </div>

  <div class="ring-section">
    <div class="ring-wrap">
      <svg width="220" height="220" id="ring-svg">
        <circle cx="110" cy="110" r="97" fill="none" stroke="#1a1a28" stroke-width="12"/>
        <circle cx="110" cy="110" r="97" fill="none" id="ring-progress"
          stroke="#f97316" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="0 609.7" style="transition: stroke-dasharray 0.6s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-number" id="ring-number">0</div>
        <div class="ring-unit">CALORIES</div>
        <div class="ring-remaining" id="ring-remaining"></div>
      </div>
    </div>
    <div class="ring-stats">
      <div class="stat">
        <div class="stat-num" id="stat-goal">2000</div>
        <div class="stat-label">Goal</div>
      </div>
      <div class="stat-div"></div>
      <div class="stat">
        <div class="stat-num" id="stat-entries">0</div>
        <div class="stat-label">Entries</div>
      </div>
    </div>
  </div>

  <div class="input-section">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('ai', this)">AI Lookup</button>
      <button class="tab-btn" onclick="switchTab('frequent', this)">Frequent</button>
      <button class="tab-btn" onclick="switchTab('manual', this)">Manual</button>
    </div>

    <div class="tab-content active" id="tab-ai">
      <div class="search-row">
        <input class="field" id="ai-query" type="text" placeholder="e.g. grilled salmon with rice..."
          onkeydown="if(event.key==='Enter') doAILookup()">
        <button class="go-btn" id="go-btn" onclick="doAILookup()">→</button>
      </div>
      <div class="error-msg" id="ai-error" style="display:none"></div>
      <div class="result-card" id="result-card" style="display:none">
        <div class="result-name" id="result-name"></div>
        <div class="result-serving" id="result-serving"></div>
        <div class="result-cal" id="result-cal"></div>
        <button class="add-btn" onclick="addResult()">+ Add to log</button>
      </div>
    </div>

    <div class="tab-content" id="tab-frequent">
      <div id="frequent-list"></div>
    </div>

    <div class="tab-content" id="tab-manual">
      <div class="manual-fields">
        <input class="field" id="manual-name" type="text" placeholder="Food name">
        <input class="field" id="manual-cal" type="number" placeholder="Calories" inputmode="numeric"
          onkeydown="if(event.key==='Enter') addManual()">
        <button class="primary-btn" onclick="addManual()">Add to log</button>
      </div>
    </div>
  </div>

  <div class="log-section" id="log-section" style="display:none">
    <div class="section-title">Today's log</div>
    <div id="log-list"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Settings</div>
    <div class="modal-sub">Customize your daily targets</div>
    <div class="modal-group">
      <div class="modal-label">Daily Calorie Goal</div>
      <input class="field" id="goal-input" type="number" placeholder="2000" inputmode="numeric">
    </div>
    <div class="modal-group">
      <div class="modal-label">Anthropic API Key</div>
      <input class="field" id="api-key-input" type="password" placeholder="sk-ant-...">
      <div class="api-note">Required for AI food lookup. Stored only on your device, never sent anywhere except Anthropic's API.</div>
    </div>
    <button class="modal-save" onclick="saveSettings()">Save</button>
    <button class="modal-cancel" onclick="closeSettings()">Cancel</button>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let state = {
  goal: 2000,
  apiKey: '',
  log: [],       // [{id, name, calories, time}]
  frequent: [],  // [{name, calories, count}]
  aiResult: null,
};

const CIRC = 2 * Math.PI * 97; // ring circumference

// ── Storage ──────────────────────────────────────────────────────────────────
function todayKey() {
  const d = new Date();
  return `fuel_log_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function load() {
  state.goal = parseInt(localStorage.getItem('fuel_goal') || '2000');
  state.apiKey = localStorage.getItem('fuel_apikey') || '';
  state.frequent = JSON.parse(localStorage.getItem('fuel_frequent') || '[]');
  state.log = JSON.parse(localStorage.getItem(todayKey()) || '[]');
}

function persist() {
  localStorage.setItem(todayKey(), JSON.stringify(state.log));
  localStorage.setItem('fuel_frequent', JSON.stringify(state.frequent));
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const total = state.log.reduce((s, e) => s + e.calories, 0);
  const pct = Math.min(total / state.goal, 1);
  const over = total > state.goal;

  // Ring
  document.getElementById('ring-number').textContent = total.toLocaleString();
  document.getElementById('ring-number').style.color = over ? 'var(--danger)' : 'var(--text)';
  document.getElementById('ring-progress').setAttribute('stroke-dasharray', `${pct * CIRC} ${CIRC}`);
  document.getElementById('ring-progress').setAttribute('stroke', over ? '#ef4444' : '#f97316');
  const left = state.goal - total;
  const rem = document.getElementById('ring-remaining');
  rem.textContent = over ? `+${(total - state.goal).toLocaleString()} over` : `${left.toLocaleString()} left`;
  rem.style.color = over ? 'var(--danger)' : 'var(--accent)';

  // Stats
  document.getElementById('stat-goal').textContent = state.goal.toLocaleString();
  document.getElementById('stat-entries').textContent = state.log.length;

  // Frequent list
  const fl = document.getElementById('frequent-list');
  if (state.frequent.length === 0) {
    fl.innerHTML = '<div class="freq-empty">Foods you log often will appear here.</div>';
  } else {
    fl.innerHTML = state.frequent.slice(0,12).map(f => `
      <div class="freq-item">
        <div>
          <div class="freq-name">${esc(f.name)}</div>
          <div class="freq-meta">${f.calories} kcal · logged ${f.count}×</div>
        </div>
        <button class="freq-add" onclick='addFrequent(${JSON.stringify(f.name)}, ${f.calories})'>+</button>
      </div>`).join('');
  }

  // Log
  const ls = document.getElementById('log-section');
  const ll = document.getElementById('log-list');
  if (state.log.length === 0) {
    ls.style.display = 'none';
  } else {
    ls.style.display = 'block';
    ll.innerHTML = [...state.log].reverse().map(e => `
      <div class="log-item">
        <div>
          <div class="log-name">${esc(e.name)}</div>
          <div class="log-time">${e.time}</div>
        </div>
        <div class="log-right">
          <div class="log-cal">${e.calories}</div>
          <button class="remove-btn" onclick="removeEntry(${e.id})">×</button>
        </div>
      </div>`).join('');
  }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Actions ──────────────────────────────────────────────────────────────────
function addEntry(name, calories) {
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  state.log.push({ id: Date.now(), name, calories, time });

  // Update frequent
  const idx = state.frequent.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
  if (idx >= 0) {
    state.frequent[idx].count++;
    state.frequent[idx].calories = calories;
  } else {
    state.frequent.push({ name, calories, count: 1 });
  }
  state.frequent.sort((a, b) => b.count - a.count);
  if (state.frequent.length > 30) state.frequent = state.frequent.slice(0, 30);

  persist();
  render();
}

function removeEntry(id) {
  state.log = state.log.filter(e => e.id !== id);
  persist();
  render();
}

function addFrequent(name, calories) {
  addEntry(name, calories);
}

function addManual() {
  const name = document.getElementById('manual-name').value.trim();
  const cal = parseInt(document.getElementById('manual-cal').value);
  if (!name || !cal || cal <= 0) return;
  addEntry(name, cal);
  document.getElementById('manual-name').value = '';
  document.getElementById('manual-cal').value = '';
}

// ── AI Lookup ─────────────────────────────────────────────────────────────────
async function doAILookup() {
  const query = document.getElementById('ai-query').value.trim();
  if (!query) return;

  if (!state.apiKey) {
    showError('Add your Anthropic API key in Settings (⚙) to use AI lookup.');
    return;
  }

  const btn = document.getElementById('go-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  hideResult();
  hideError();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 150,
        system: 'You are a nutrition database. Respond ONLY with a valid JSON object — no markdown, no backticks, no explanation. Format: {"name":"standardized food name","calories":number,"serving":"serving size"}. Be accurate for common foods. Assume one standard serving if ambiguous.',
        messages: [{ role: 'user', content: `Calories in: ${query}` }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.content[0].text.trim();
    const result = JSON.parse(text);
    state.aiResult = result;
    showResult(result);
  } catch (e) {
    showError('Could not look up that food. Check your API key or try manual entry.');
    console.error(e);
  }

  btn.disabled = false;
  btn.innerHTML = '→';
}

function showResult(r) {
  document.getElementById('result-name').textContent = r.name;
  document.getElementById('result-serving').textContent = r.serving;
  document.getElementById('result-cal').innerHTML = `${r.calories} <span>kcal</span>`;
  document.getElementById('result-card').style.display = 'block';
}

function hideResult() {
  document.getElementById('result-card').style.display = 'none';
  state.aiResult = null;
}

function showError(msg) {
  const el = document.getElementById('ai-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('ai-error').style.display = 'none';
}

function addResult() {
  if (!state.aiResult) return;
  addEntry(state.aiResult.name, state.aiResult.calories);
  hideResult();
  document.getElementById('ai-query').value = '';
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

// ── Settings ─────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('goal-input').value = state.goal;
  document.getElementById('api-key-input').value = state.apiKey;
  document.getElementById('overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('overlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeSettings();
}

function saveSettings() {
  const g = parseInt(document.getElementById('goal-input').value);
  if (g > 0) {
    state.goal = g;
    localStorage.setItem('fuel_goal', g);
  }
  const key = document.getElementById('api-key-input').value.trim();
  state.apiKey = key;
  localStorage.setItem('fuel_apikey', key);
  closeSettings();
  render();
}

// ── Date ─────────────────────────────────────────────────────────────────────
function setDate() {
  const d = new Date();
  const label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
  document.getElementById('date-label').textContent = label;
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
setDate();
render();

// Prompt for API key first time
if (!state.apiKey) {
  // Slight delay so app renders first
  setTimeout(() => {
    document.getElementById('ai-error').textContent = 'Add your Anthropic API key in Settings (⚙) to enable AI food lookup.';
    document.getElementById('ai-error').style.display = 'block';
  }, 500);
}
</script>
</body>
</html>
